<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heyyy Babyyy 🤭💋</title>

<!-- Cute Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #ffe6f0, #fff0f5);
        overflow-x: hidden;
    }

    h1 {
        font-family: 'Pacifico', cursive;
        color: #ff2e63;
        font-size: 48px;
        margin-top: 40px;
    }

    .question {
        font-size: 26px;
        font-weight: bold;
        color: #ff4d6d;
    }

    img {
        width: 260px;
        margin: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    video {
        width: 150px;
        margin: 10px;
        border-radius: 15px;
    }

    button {
        padding: 15px 35px;
        font-size: 22px;
        margin: 15px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    .yes {
        background: #4CAF50;
        color: white;
    }

    .no {
        background: #f44336;
        color: white;
    }

    button:hover {
        transform: scale(1.15);
        box-shadow: 0 0 20px #ff4d6d;
    }

    #response {
        margin-top: 25px;
        font-size: 22px;
        color: #ff2e63;
        font-weight: bold;
    }

    footer {
        margin-top: 40px;
        font-size: 18px;
        color: #ff4d6d;
        font-family: 'Pacifico', cursive;
    }

    /* Floating hearts */
    @keyframes floatUp {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .heart {
        position: fixed;
        font-size: 24px;
        animation: floatUp 5s linear infinite;
        pointer-events: none;
    }
</style>
</head>

<body onclick="playMusic()">

<!-- Background music -->
<audio id="bgMusic" loop>
    <source src="music.mpeg" type="audio/mpeg">
</audio>

<h1>Heyyy Babyyy 🤭💋</h1>
<p class="question">Will you be my Valentine 💍</p>

<img src="dudu.jpeg" alt="Dudu with Rose">
<br>
<video src="bubu.mp4" autoplay loop muted></video>

<br><br>

<button class="yes" onclick="yes()">YES</button>
<button class="no" id="noBtn" onclick="no()">NO</button>

<h2 id="response"></h2>

<footer>
    Proposal for Vampuuuuuu from her Bhoot 😚💍
</footer>

<script>
let musicPlayed = false;
let noCount = 0;

const noMessages = [
    "Aaisa mat kahiye na bachhha 🥹💋",
    "Ab sanbi aur bisan ka kyaa hoga? 😭💋",
    "Mamuu laii vandinxu pakhhh 🥹💋",
    "Yes boldijiye 🥹💋",
    "Jaldi yes bolooo 🔪"
];

function playMusic() {
    if (!musicPlayed) {
        document.getElementById("bgMusic").play();
        musicPlayed = true;
    }
}

function yes() {
    playMusic();
    document.getElementById("response").innerHTML =
        "Iknewww you'll say yes babyyyyyyy 😚💍<br>" +
        "I'm so lucky to have youuuuuuuu 😚💋<br>" +
        "<b>21st May 2025 to forever 😚💍</b>";
}

function no() {
    playMusic();
    noCount++;

    if (noCount <= 5) {
        const msg = noMessages[Math.floor(Math.random() * noMessages.length)];
        document.getElementById("response").innerText = msg;
    } else {
        document.getElementById("noBtn").style.display = "none";
        document.getElementById("response").innerText =
            "Hehe 😏 now only YES is left 💍";
    }
}

/* Floating hearts */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (12 + Math.random() * 30) + "px";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 300);

/* Tap pop hearts */
document.body.addEventListener("click", () => {
    const pop = document.createElement("div");
    pop.innerText = "💖";
    pop.style.position = "absolute";
    pop.style.left = Math.random() * window.innerWidth + "px";
    pop.style.top = Math.random() * window.innerHeight + "px";
    pop.style.fontSize = "24px";
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
});
</script>

</body>
</html>
