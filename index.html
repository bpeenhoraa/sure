<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heyyy Babyyy 🥹💋</title>

<!-- Cute Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #cce7ff, #e0f7ff); /* sky blue gradient */
        overflow-x: hidden;
    }

    h1 {
        font-family: 'Pacifico', cursive;
        color: #0099ff; /* deep sky blue */
        font-size: 48px;
        margin-top: 40px;
    }

    .question {
        font-size: 26px;
        font-weight: bold;
        color: #33ccff; /* lighter sky blue */
    }

    img {
        width: 260px;
        margin: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    video {
        width: 150px;
        margin: 10px;
        border-radius: 15px;
    }

    button {
        padding: 15px 35px;
        font-size: 22px;
        margin: 15px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.3s;
        color: white;
        font-weight: bold;
    }

    /* YES button with magical glow */
    .yes {
        background: linear-gradient(45deg, #6a11cb, #2575fc);
        position: relative;
        box-shadow: 0 0 15px #6a11cb, 0 0 25px #2575fc;
        animation: glowPulse 2s infinite alternate;
    }

    @keyframes glowPulse {
        0% {
            box-shadow: 0 0 15px #6a11cb, 0 0 25px #2575fc;
        }
        50% {
            box-shadow: 0 0 25px #8e44ad, 0 0 35px #3498db;
        }
        100% {
            box-shadow: 0 0 15px #6a11cb, 0 0 25px #2575fc;
        }
    }

    .yes:hover {
        transform: scale(1.2);
        box-shadow: 0 0 30px #8e44ad, 0 0 50px #3498db;
    }

    /* NO button soft coral gradient */
    .no {
        background: linear-gradient(45deg, #ff5f6d, #ffc371);
    }

    button:hover {
        transform: scale(1.15);
    }

    #response {
        margin-top: 25px;
        font-size: 22px;
        color: #0099ff;
        font-weight: bold;
    }

    footer {
        margin-top: 40px;
        font-size: 18px;
        color: #33ccff;
        font-family: 'Pacifico', cursive;
    }

    /* Floating hearts */
    @keyframes floatUp {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .heart {
        position: fixed;
        font-size: 24px;
        animation: floatUp 5s linear infinite;
        pointer-events: none;
    }
</style>
</head>

<body onclick="playMusic()">

<!-- Background music -->
<audio id="bgMusic" loop>
    <source src="music.mpeg" type="audio/mpeg">
</audio>

<h1>Heyyy Babyyy 🥹💋</h1>
<p class="question">Will you forgive me sanaaaaaa?🥹💋</p>

<img src="both.jpg" alt="Dudu with Rose">
<br>
<video src="bubu.mp4" autoplay loop muted></video>

<br><br>

<button class="yes" onclick="yes()">YES</button>
<button class="no" id="noBtn" onclick="no()">NO</button>

<h2 id="response"></h2>

<footer>
    Sollyyyyyyyyyyyy letter for my cutuuuuuuuu🥹💋
</footer>

<script>
let musicPlayed = false;
let noCount = 0;

const noMessages = [
    "Aba dekhi repeat hudaina pakka 🥹💋",
    "Iloveeeeeeeeeyouuuuuuuuuu? 😭💋",
    "Sollyyyyyyyyyy mero puntuuuuuuuu 🥹💋",
    "It's okeyyyyyyy boldijiye boldijiye 🥹💋",
    "Papa ko maf kardijiye 🥹💋"
];

function playMusic() {
    if (!musicPlayed) {
        document.getElementById("bgMusic").play();
        musicPlayed = true;
    }
}

function yes() {
    playMusic();
    document.querySelector('img').style.display = 'none';
    document.querySelector('video').style.display = 'none';

    document.getElementById("response").innerHTML =
        "I'm really sorry for everything I did yesterday and today 🥹<br>" +
        "I never meant to hurt you, and I regret my mistakes 🥹<br>" +
        "You mean so much to me, more than I can explain anee aba dekhi pakka repeat hunna husss saneyyyyy ❤️<br>" +
        "Please sanuuuuuuuu forgive me and give me one more chance 🙏<br>" +
        "I promise to do better and make everything right husssss ?🥹 Iloveeeeeeyouuuuuuuu🥹🌹";

    const photo = document.createElement("img");
    photo.src = "both.jpg";
    photo.style.width = "300px";
    photo.style.borderRadius = "20px";
    photo.style.marginTop = "20px";
    photo.style.boxShadow = "0 10px 20px rgba(0,0,0,0.2)";
    document.body.appendChild(photo);
}

function no() {
    playMusic();
    noCount++;

    if (noCount <= 5) {
        const msg = noMessages[Math.floor(Math.random() * noMessages.length)];
        document.getElementById("response").innerText = msg;
    } else {
        document.getElementById("noBtn").style.display = "none";
        document.getElementById("response").innerText =
            "Hehe it's okeyy boldijiye ab toh 🥹❤️";
    }
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (12 + Math.random() * 30) + "px";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 300);

document.body.addEventListener("click", () => {
    const pop = document.createElement("div");
    pop.innerText = "💖";
    pop.style.position = "absolute";
    pop.style.left = Math.random() * window.innerWidth + "px";
    pop.style.top = Math.random() * window.innerHeight + "px";
    pop.style.fontSize = "24px";
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
});
</script>

</body>
</html>
